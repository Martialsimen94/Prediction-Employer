server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (dist/assets/*) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router (client-side routing): let the SPA's own router resolve
    # every path that isn't a real file, rather than nginx 404ing on e.g.
    # a hard refresh of /employees/42.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
