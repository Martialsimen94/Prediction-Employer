[tool.poetry]
name = "ai-employee-retention-platform"
version = "0.1.0"
description = "AI-powered platform to predict, explain, and act on employee attrition risk."
authors = ["Simen Martial <martialsimen94@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "^2.9"
pydantic-settings = "^2.6"
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg = { version = "^3.2", extras = ["binary"] }
python-dotenv = "^1.0"
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-asyncio = "^0.24"
httpx = "^0.27"
ruff = "^0.8"
mypy = "^1.13"
pre-commit = "^4.0"
faker = "^33.0"

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
python-jose = { version = "^3.3", extras = ["cryptography"] }
argon2-cffi = "^23.1"
celery = { version = "^5.4", extras = ["redis"] }
redis = "^5.2"
slowapi = "^0.1.9"
email-validator = "^2.3.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
pandas = "^2.2"
numpy = "^2.1"
scikit-learn = "^1.5"
xgboost = "^2.1"
lightgbm = "^4.5"
catboost = "^1.2"
optuna = "^4.1"
shap = "^0.52"
lime = "^0.2.0.1"
mlflow = "^2.18"
imbalanced-learn = "^0.13"
openpyxl = "^3.1"
pandera = "^0.21"
multimethod = "<2.0"
matplotlib = "^3.11.1"
nbclient = "^0.11.0"
ipykernel = "^7.3.0"
nbformat = "^5.11.1"

[tool.poetry.group.dashboards]
optional = true

[tool.poetry.group.dashboards.dependencies]
streamlit = "^1.40"
dash = "^2.18"
plotly = "^5.24"
reportlab = "^4.2"
xlsxwriter = "^3.2"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/app", "ml"]
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Notebooks need sys.path set up (repo root / backend) before local imports.
"ml/notebooks/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend", "ml"]
exclude = ["tests", "ml/notebooks", "backend/alembic/versions"]

[[tool.mypy.overrides]]
module = [
  "shap.*",
  "lime.*",
  "catboost.*",
  "lightgbm.*",
  "mlflow.*",
  "optuna.*",
  "jose.*",
  "slowapi.*",
  "celery.*",
  "pandas.*",
  "sklearn.*",
  "faker.*",
  "pandera.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test modules are intentionally excluded from strict checking (see `exclude`
# above); this also covers them when reached indirectly via import-following
# rather than as a direct mypy argument (e.g. ml/tests importing fixtures
# from backend/tests/conftest.py).
module = ["tests.*", "ml.tests.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=backend/app --cov=ml --cov-report=term-missing"
testpaths = ["backend/tests", "ml/tests"]
pythonpath = ["backend", "."]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/notebooks/*"]
